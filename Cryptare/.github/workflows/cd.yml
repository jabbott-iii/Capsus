name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # go-sqlite3 needs CGO, so each target is built with a native C toolchain on
  # a runner of the matching OS (darwin/amd64 is cross-compiled by clang on the
  # Apple Silicon runner). Third-party actions are pinned to full commit SHAs.
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, smoke: true }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, smoke: true }
          - { goos: darwin, goarch: arm64, runner: macos-latest, smoke: true }
          - { goos: darwin, goarch: amd64, runner: macos-latest, smoke: false }
          - { goos: windows, goarch: amd64, runner: windows-latest, smoke: true }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # manual run fallback
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        id: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          VERSION: ${{ steps.meta.outputs.tag }}
          # The Dockerfile's builder image, pinned by digest. Linux binaries are linked
          # statically against its musl C library (MIT) instead of the runner's glibc
          # (LGPL) (Q-013). Update it with the Dockerfile when go.mod's toolchain changes.
          LINUX_BUILDER: golang:1.26.9-alpine@sha256:3082400e369fa24d5fc60bca20edab3f6d604e0c5a690ec66b295eff4dd87ade
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/cryptare_${GOOS}_${GOARCH}${ext}"
          tags=""
          ldflags="-s -w -X main.version=${VERSION}"
          mkdir -p dist
          if [ "$GOOS" = "linux" ]; then
            # Static, so the binary runs on any Linux; netgo/osusergo keep the C
            # library out of name and user lookups, and extension loading (dlopen)
            # is not used by Cryptare. The container runs on the runner's own
            # architecture, which the matrix pairs with GOARCH. GIT_OPTIONAL_LOCKS=0
            # stops VCS stamping from rewriting .git/index as root.
            tags="sqlite_omit_load_extension,osusergo,netgo"
            ldflags="$ldflags -linkmode external -extldflags -static"
            docker run --rm -v "$PWD:/src" -w /src \
              -e CGO_ENABLED -e GOOS -e GOARCH -e GIT_OPTIONAL_LOCKS=0 \
              -e TAGS="$tags" -e LDFLAGS="$ldflags" -e OUT="$out" \
              "$LINUX_BUILDER" sh -euc '
                apk add --no-cache build-base git >/dev/null
                git config --global --add safe.directory /src
                go build -tags "$TAGS" -ldflags="$LDFLAGS" -o "$OUT" .
                chown "$(stat -c %u:%g /src)" "$OUT"'
          else
            go build -tags "$tags" -ldflags="$ldflags" -o "$out" .
          fi
          echo "binary=$out" >> "$GITHUB_OUTPUT"

      - name: Smoke test binary
        if: matrix.smoke
        shell: bash
        env:
          CRYPTARE_DB_PATH: ${{ runner.temp }}/smoke.db
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          bin="./${{ steps.build.outputs.binary }}"
          # The printed version must carry the tag stamped in by -X main.version.
          "$bin" --version | grep -qF -- "$VERSION"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            file "$bin" | grep -q "statically linked"
          fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Only Windows system DLLs may be imported: the MinGW-w64 runtime and
            # libgcc are linked in, and their notices ship in THIRD_PARTY_LICENSES.txt
            # (Q-013). A DLL from the toolchain would also be missing on users' machines.
            if command -v objdump >/dev/null; then
              objdump -p "$bin" | grep -i "DLL Name" | tee dlls.txt
              if grep -iE 'lib(winpthread|gcc|stdc|ssp)' dlls.txt; then
                echo "::error::The binary imports a MinGW-w64 toolchain DLL."
                exit 1
              fi
            else
              echo "::warning::objdump not found; the binary's DLL imports were not checked."
            fi
          fi
          # Throwaway test passphrase, passed by file so it stays out of the arguments.
          printf 'release-smoke-passphrase\n' > smoke-pw.txt
          "$bin" keys generate --password-file smoke-pw.txt
          "$bin" keys list | grep -q "AES-256-GCM"
          printf 'cryptare release smoke test\n' > smoke.txt
          "$bin" encrypt smoke.txt --password-file smoke-pw.txt
          "$bin" decrypt smoke.txt.enc --output smoke.out --password-file smoke-pw.txt
          cmp smoke.txt smoke.out

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

      # The image for GitHub Packages is built natively on each Linux runner (go-sqlite3
      # needs CGO) and handed to the image job as an artifact, so no job that builds or
      # runs code can write packages. BuildKit's own provenance is off: it would add
      # unknown/unknown platform entries to the package; the image-attest job attests the
      # published image. The source label links the package to this repository.
      - name: Build container image
        if: matrix.goos == 'linux'
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          docker build --provenance=false --file Dockerfile \
            --build-arg VERSION="$VERSION" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION#v}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.title=cryptare" \
            --label "org.opencontainers.image.description=Terminal file encryption and compression tool" \
            --tag "cryptare:release-${GOARCH}" .

      - name: Smoke test container image
        if: matrix.goos == 'linux'
        shell: bash
        env:
          REF: cryptare:release-${{ matrix.goarch }}
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          docker run --rm "$REF" --version | grep -qF -- "$VERSION"
          # The image must run as its unprivileged user, never root (SEC-013).
          test "$(docker run --rm --entrypoint id "$REF" -u)" = 10001
          # Throwaway test passphrase, mounted as a file so it stays out of the arguments.
          docker volume create cryptare-release-smoke
          printf 'release-smoke-passphrase\n' > image-smoke-pw.txt
          docker run --rm -v cryptare-release-smoke:/app/data -v "$PWD/image-smoke-pw.txt:/run/smoke-pw.txt:ro" \
            "$REF" keys generate --password-file /run/smoke-pw.txt
          docker run --rm -v cryptare-release-smoke:/app/data "$REF" keys list | grep -q "AES-256-GCM"

      - name: Save container image
        if: matrix.goos == 'linux'
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p image
          docker save --output "image/cryptare_linux_${GOARCH}.tar" "cryptare:release-${GOARCH}"

      - name: Upload container image
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-linux-${{ matrix.goarch }}
          path: image/cryptare_linux_${{ matrix.goarch }}.tar
          if-no-files-found: error

  release:
    name: Package and Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations: signed with the workflow's OIDC identity and
      # stored with the repository's attestations.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No module cache in the job that publishes the release.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Licence texts of the Go standard library and of every module in the
      # binaries; each archive carries them with LICENSE and NOTICE (Q-006).
      - name: Generate third-party licences
        shell: bash
        run: bash scripts/third-party-licenses.sh THIRD_PARTY_LICENSES.txt

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: Package release artifacts
        shell: bash
        run: |
          cd dist
          # Each archive holds the binary, LICENSE, NOTICE and THIRD_PARTY_LICENSES.txt.
          docs=(LICENSE NOTICE THIRD_PARTY_LICENSES.txt)
          for bin in cryptare_*; do
            name="${bin%.exe}"
            chmod +x "$bin"
            if [ "$bin" != "$name" ]; then
              zip -q "${name}.zip" "$bin"
              (cd .. && zip -q "dist/${name}.zip" "${docs[@]}")
            else
              tar -czf "${name}.tar.gz" "$bin" -C .. "${docs[@]}"
            fi
            rm "$bin"
          done
          ls -l

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- * > checksums.txt

      # Signed SLSA build provenance for every published file, so a download can be
      # checked as built by this workflow from this repository, which checksums.txt
      # alone can't show: gh attestation verify <file> --repo jabbott-iii/Cryptare
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Publishes the tested images to GitHub Packages (ghcr.io/<owner>/cryptare) on tags,
  # after the release job, so an image is never published for a release that failed.
  # Only this job can write packages; it checks out and builds nothing, cannot mint
  # OIDC tokens, and uses plain docker commands rather than third-party actions. A
  # manual run builds and smoke-tests the images (build job) without publishing them.
  image:
    name: Publish container image
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      name: ${{ steps.push.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Download container images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-linux-*
          merge-multiple: true
          path: image

      - name: Log in to GitHub Packages
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # One multi-platform image (linux/amd64 and linux/arm64) tagged X.Y.Z always, and
      # X.Y and latest only when this is the newest release of that line and overall, so
      # publishing an older patch release later doesn't move them back. Pre-releases
      # (vX.Y.Z-rc.1) get only their own tag. Each platform's image is also tagged
      # X.Y.Z-amd64 or X.Y.Z-arm64. The multi-platform tag is pushed last, so the
      # package page offers it (latest for a new release) as the install command. Both
      # images are checked before anything is pushed.
      - name: Push image
        id: push
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cryptare"
          if ! [[ "$REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $REF_NAME isn't vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE."
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}"
          version="${REF_NAME#v}"
          tags=("$version")
          if [[ "$version" != *-* ]]; then
            releases="$(git ls-remote --tags --refs "$REPO_URL" 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)"
            if [ "$(grep -E "^v${major}\.${minor}\." <<<"$releases" | tail -n1)" = "$REF_NAME" ]; then
              tags+=("${major}.${minor}")
            fi
            if [ "$(tail -n1 <<<"$releases")" = "$REF_NAME" ]; then
              tags+=(latest)
            fi
          fi
          echo "Image $image, tags: ${tags[*]}"
          digest_of() {
            local digest
            digest="$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest)"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Couldn't read the digest of $1: $digest" >&2
              return 1
            fi
            echo "$digest"
          }
          for arch in amd64 arm64; do
            docker load --input "image/cryptare_linux_${arch}.tar"
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "cryptare:release-${arch}")"
            if [ "$platform" != "linux/${arch}" ]; then
              echo "::error::cryptare:release-${arch} is built for ${platform}."
              exit 1
            fi
          done
          sources=()
          for arch in amd64 arm64; do
            docker tag "cryptare:release-${arch}" "${image}:${version}-${arch}"
            docker push "${image}:${version}-${arch}"
            sources+=("${image}@$(digest_of "${image}:${version}-${arch}")")
          done
          # A multi-platform image's description and source come from its index.
          args=(
            --annotation "index:org.opencontainers.image.source=${REPO_URL}"
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}"
            --annotation "index:org.opencontainers.image.version=${version}"
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0"
            --annotation "index:org.opencontainers.image.title=cryptare"
            --annotation "index:org.opencontainers.image.description=Terminal file encryption and compression tool"
          )
          for tag in "${tags[@]}"; do
            args+=(--tag "${image}:${tag}")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          # Every multi-platform tag names the same index; its digest is what
          # image-attest attests.
          digest="$(digest_of "${image}:${version}")"
          {
            echo "name=${image}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
          echo "Pushed ${image}@${digest} as: ${tags[*]}"

      - name: Log out of GitHub Packages
        if: always()
        run: docker logout ghcr.io

  # Attests the published image. This job can mint OIDC tokens but cannot write
  # packages or contents. The attestation is stored with the repository's attestations,
  # not pushed to the registry: GitHub Packages would list it as an extra
  # sha256-<digest> tag and offer that as the package's install command.
  image-attest:
    name: Attest container image
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      # Verify with: gh attestation verify oci://ghcr.io/<owner>/cryptare:<version> --repo <owner>/Cryptare
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.image.outputs.name }}
          subject-digest: ${{ needs.image.outputs.digest }}
          # Storage records are only for organisation-owned repositories.
          create-storage-record: false
