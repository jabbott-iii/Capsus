name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Linux release binaries (cd.yml) come from the Dockerfile's "static"
  # stage (intel/plan.md P-030); build them here too so a pull request cannot
  # break the release. Capsus publishes no container image (intel/plan.md D-8).
  static-linux-binary:
    name: Static Linux binary (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build static binary
        run: docker build --target static --build-arg VERSION=ci --output type=local,dest=out .

      # Fully static musl binary (no program interpreter) with an 8 MiB thread
      # stack request, because the tools' SQLite calls run on musl threads
      # (128 KiB by default; intel/maint.md §5). It must pass the full smoke
      # test on the runner and run on an older glibc distribution and on
      # musl-based Alpine.
      - name: Smoke test static binary
        run: |
          file out/capsus | grep "statically linked" > /dev/null
          headers="$(readelf -lW out/capsus)"
          if grep -q INTERP <<< "$headers"; then
            echo "binary has a program interpreter" >&2
            exit 1
          fi
          grep GNU_STACK <<< "$headers" | grep 0x800000 > /dev/null
          bash scripts/smoke.sh out/capsus ci
          for image in debian:11 alpine:3.24; do
            docker run --rm -v "$PWD/out:/out:ro" \
              -e MUNUS_DB_PATH=/tmp/munus.db -e CRYPTARE_DB_PATH=/tmp/cryptare.db -e SALUS_DB_PATH=/tmp/salus.db \
              "$image" sh -c "/out/capsus list | grep -qi salus \
                && /out/capsus munus add --title smoke --description 'static binary smoke test' \
                && /out/capsus munus list | grep -q smoke \
                && /out/capsus salus check list | grep -q misconfig"
          done
